[package]
name = "roastake-coffee-token"
version.workspace = true
edition.workspace = true
authors = ["@MTheMoneyApe"]
license-file = "../../LICENSE-ROASTAKE-PERPS.md"
publish = false
repository.workspace = true
description = "Reusable NEP-141/145/148 Coffee Asset token contract with capped simulated Testnet inventory for ROASTAKE"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.1", features = ["legacy"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
