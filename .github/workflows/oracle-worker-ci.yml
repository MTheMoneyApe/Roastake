name: Live coffee oracle worker (Testnet)

on:
  push:
    branches:
      - feat/live-coffee-oracle-testnet
    paths:
      - "workers/coffee-price-index/**"
      - "packages/shared/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/oracle-worker-ci.yml"
  pull_request:
    branches:
      - hackathon-submission
    paths:
      - "workers/coffee-price-index/**"
      - "packages/shared/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/oracle-worker-ci.yml"

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain and WASI target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run worker and Perps view tests
        run: cargo test -p roastake-coffee-price-index -p roastake-perpetuals

      - name: Build OutLayer WASI worker
        run: cargo build --release -p roastake-coffee-price-index --features wasi-http --target wasm32-wasip2
